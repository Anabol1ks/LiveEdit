syntax = "proto3";

package liveedit.v1;

option go_package = "proto/editor;editorpb";

// import "validate/validate.proto";
// import "google/api/annotations.proto";
// import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "LiveEdit"
    version: "1.0"
    description: "LiveEdit API"
  }
  security_definitions: {
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "JWT Authorization header using the Bearer scheme. Example: \"Authorization: Bearer {token}\""
      }
    }
  }
  security: {
    security_requirement: {
      key: "Bearer"
      value: {}
    }
  }
};

service EditorService {
  rpc EditDocument(stream EditStreamRequest) returns (stream EditStreamResponse) {
    option (google.api.http) = {
      post: "/api/editor/document/stream"
      body: "*"
    };
  }
}

message EditStreamRequest {
  oneof payload {
    InitSync init = 1;
    EditOperation operation = 2;
    CursorUpdate cursor = 3;
  }
}

message EditStreamResponse {
  oneof payload {
    EditOperation operation = 1;
    CursorUpdate cursor = 2;
    InitSync init = 3;
  }
}

message InitSync {
  uint64 document_id = 1 [(validate.rules).uint64.gt = 0];
  string client_id = 2;
}

message EditOperation {
  string client_id = 1;
  uint64 document_id = 2;
  int32 position = 3;
  string text = 4; // вставленный/удалённый текст
  bool is_insert = 5;
  string timestamp = 6;
}

message CursorUpdate {
  string client_id = 1;
  uint64 document_id = 2;
  int32 position = 3;
}
