syntax = "proto3";

package user;

option go_package = "proto/user;userpb";

import "google/protobuf/empty.proto";
// import "validate/validate.proto";
// import "google/api/annotations.proto";
// import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "LiveEdit"
    version: "1.0"
    description: "LiveEdit API"
  }
  security_definitions: {
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "JWT Authorization header using the Bearer scheme. Example: \"Authorization: Bearer {token}\""
      }
    }
  }
//   security: {
//     security_requirement: {
//       key: "Bearer"
//       value: {}
//     }
//   }
};

service UserService {
  rpc Register(RegisterRequest) returns (AuthResponse) {
    option (google.api.http) = {
      post: "/api/user/register"
      body: "*"
    };
  }
  rpc Login(LoginRequest) returns (AuthResponse) {
    option (google.api.http) = {
      post: "/api/user/login"
      body: "*"
    };
  }
  rpc RefreshToken(RefreshRequest) returns (AuthResponse) {
    option (google.api.http) = {
      post: "/api/user/refresh"
      body: "*"
    };
  }
  rpc GetProfile(google.protobuf.Empty) returns (ProfileResponse) {
    option (google.api.http) = {
      get: "/api/user/profile"
    };
    // Если хотите явно только для этого метода:
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {
        security_requirement: {
          key: "Bearer"
          value: {}
        }
      }
    };
  }
}


message RegisterRequest {
  string email = 1 [(validate.rules).string = {email: true, min_len: 5, max_len: 64}];
  string username = 2 [(validate.rules).string = {min_len: 3, max_len: 32}];
  string password = 3 [(validate.rules).string = {min_len: 8, max_len: 64}];
}

message LoginRequest {
  string email = 1 [(validate.rules).string = {email: true}];
  string password = 2 [(validate.rules).string = {min_len: 8}];
}

message RefreshRequest {
  string refresh_token = 1 [(validate.rules).string = {min_len: 10}];
}

message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message ProfileResponse {
  uint64 id = 1;
  string email = 2;
  string username = 3;
  string created_at = 4;
}
